services:
  agente:
    build: .
    ports:
      - "8000:8000"
    env_file: .env
    environment:
      # Ollama gira sul tuo PC (fuori da Docker)
      OLLAMA_URL: http://host.docker.internal:11434
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./config:/progetto/config
      - ./archivio:/progetto/archivio
      - ./output:/progetto/output
      - ./voci:/progetto/voci
